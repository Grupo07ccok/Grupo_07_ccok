
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login: Usuário</title>
    <link rel="stylesheet" href="../public/styles/style.css">
    </head>

<body>
    <div class="pagina_login">
        <!-- LATERAL IMAGEM (50%) -->
        <section class="lateral_imagem">
            <div class="lateral_imagem_interna">
                <img src="../public/assets/img/img_page_cadastro.png" class="imagem_cadastro" alt="">
            </div>
        </section>

        <!-- LATERAL FORM (50%) -->
        <section class="lateral_formulario">
            <div class="lateral_formulario_interna">
                <h1 class="titulo_login">Cadastro</h1>

                <div class="formulario_login" >
                    <label class="rotulo_login" for="nome_login">Nome</label>
                    <input class="campo_login" id="nome_cadastro" type="nome" placeholder="Insira seu nome:" required>

                    <label class="rotulo_login" for="telefone_cadastro">Telefone</label>
                    <input class="campo_login" id="telefone_cadastro" type="tel" placeholder="Insira seu telefone:" required>

                    <label class="rotulo_login" for="email_cadastro">E-mail</label>
                    <input class="campo_login" id="email_cadastro" type="email" placeholder="email@email.com" required>

                    <label class="rotulo_login" for="senha_cadastro">Senha</label>
                    <input class="campo_login" id="senha_cadastro" type="password" placeholder="********" required oninput="verificar()"> 
                    <div class="checks_cadastro">
                        <div class="check">
                            Letra maiúscula 
                            <div class="check_img" ><img id="check_upper" src="../public/assets/icons/icons-cancelar.png" alt=""></div>
                        </div>
                        <div class="check">
                            Letra minúscula
                            <div class="check_img" ><img id="check_lower" src="../public/assets/icons/icons-cancelar.png" alt=""></div>
                        </div>
                        <div class="check">
                            Número 
                            <div class="check_img" ><img id="check_num" src="../public/assets/icons/icons-cancelar.png" alt=""></div>
                        </div>
                        <div class="check">
                            Caractere especial
                            <div class="check_img" ><img id="check_especial" src="../public/assets/icons/icons-cancelar.png" alt=""></div>
                        </div>
                        <div class="check">
                            8 ou mais caracteres
                            <div class="check_img" ><img id="check_tamanho" src="../public/assets/icons/icons-cancelar.png" alt=""></div>
                        </div>

                    </div>

                    <label class="rotulo_login" for="confirma_cadastro">Confirme sua senha</label>
                    <input class="campo_login" id="confirma_cadastro" type="password" placeholder="********" required>

                    <label class="rotulo_login" for="token_cadastro">Confirme o token da empresa</label>
                    <input class="campo_login" id="token_cadastro" type="text" placeholder="********" required>

                    <!-- <button type="submit" class="botao_formulario"  -->
                     <div class="botoes_cadastro">
                         <button class="botao_padrao" onclick="cadastrar_token()">Cadastrar com token</a></button>
                        <button class="botao_padrao" onclick="cadastrar()"><a id="ir_cadastro2" href="#">Continuar e Cadastrar empresa</a></button>
                     </div>
                </div>

                <hr class="separador_login">

                <div class="redes_login">
                    <button class="botao_social google_login">
                        <img src="assets/icons/icon-google.png" alt="Google">
                        Continuar com o Google
                    </button>

                    <button class="botao_social apple_login">
                        <img src="assets/icons/icon-apple.png" alt="Apple">
                        Continuar com o Apple ID
                    </button>
                </div>

                <p class="links_login">
                    Já possui uma conta? <a class="link_login" href="login.html">Faça login</a>
                </p>
                <p class="links_login">
                    <a class="link_login" href="#">Esqueci minha senha</a>
                </p>
            </div>
        </section>

    </div>
</body>

</html>

<script>
    // Guarda em variável global:
    var guarda_nome = "";
    var guarda_email = "";
    var guarda_senha = "";
    var guarda_confirma = "";
    var senha = "";
    var crit1 = 0;
    var crit2 = 0;
    var crit3 = 0;
    var crit4 = 0;
    var crit5 = 0;
    var criteriosAtendidos = 0;

    var tokenValido = '30/10/2025'; // TOKEN PARA VALIDAR A EMPRESA

    function verificar() {
        senha = senha_cadastro.value;
        var tamanho_senha = senha.length;
        var senha_sem_especial = senha.replaceAll(/[^a-zA-Z0-9]/g,""); //troca todos os caracteres que não são números ou letras
        var tamanho_senha_sem_especial = senha_sem_especial.length;
        var senha_minuscula = senha.toLowerCase();
        var senha_maiuscula = senha.toUpperCase();

        if(senha_minuscula != senha) { // tem letras maiúsculas
            crit1 = 1;
            check_upper.src = '../public/assets/icons/icons-ok.png';
        } else {
            check_upper.src =  '../public/assets/icons/icons-cancelar.png';
            crit1 = 0;
        }
        
        if(senha_maiuscula != senha) { // tem letras minúculas
            crit2 = 1;
            check_lower.src = '../public/assets/icons/icons-ok.png';
        } else {
            check_lower.src = '../public/assets/icons/icons-cancelar.png';
            crit2 = 0;
        }
        
        if (senha.includes('0') || senha.includes('1') || senha.includes('2') || senha.includes('3') || senha.includes('4') || senha.includes('5') || senha.includes('6') || senha.includes('7') || senha.includes('8') || senha.includes('9')) {
            crit3 = 1;
            check_num.src = '../public/assets/icons/icons-ok.png';
        } else {
            check_num.src = '../public/assets/icons/icons-cancelar.png';
            crit3 = 0;
        }
        
        if(tamanho_senha != tamanho_senha_sem_especial) { // tem caracteres especiais
            crit4 = 1;
            check_especial.src = '../public/assets/icons/icons-ok.png';
        } else {
            check_especial.src = '../public/assets/icons/icons-cancelar.png';
            crit4 = 0;
        }

        if(tamanho_senha >= 8) { // tem pelo menos 8 caracteres
            crit5 = 1;
            check_tamanho.src = '../public/assets/icons/icons-ok.png';
        } else {
            check_tamanho.src = '../public/assets/icons/icons-cancelar.png';
            crit5 = 0;
        }

        criteriosAtendidos = crit1 + crit2 + crit3 + crit4 + crit5
        
    }

    function cadastrar_token() {
        // Inputs:
        var nome = nome_cadastro.value;
        var telefone = telefone_cadastro.value;
        var email = email_cadastro.value;
        var confirma = confirma_cadastro.value;
        var token = token_cadastro.value;

        if(nome == "" || telefone == "" || email == "" || senha == "" || confirma == "" || token == "") {
            alert(`Todos os campos devem estar preenchidos`)
        } else if (!email.includes('@') || (!email.endsWith('.com') && !email.endsWith('.com.br'))) {
            alert(`insira um email válido`)
        } else if (criteriosAtendidos < 5) {
            alert(`Senha deve conter todos os requisitos`)
        } else if (senha != confirma){
            alert(`A senha e a confimação devem ser iguais`)
        } else if (token != tokenValido) {
            alert(`Insira um token válido`)
        } else {
            guarda_nome = nome;
            guarda_email = email;
            guarda_senha = senha;
            guarda_confirma = confirma;

            alert(`Cadastro realizado com sucesso!`);
        } 
    }

    function cadastrar() {
        // Inputs:
        var nome = nome_cadastro.value;
        var telefone = telefone_cadastro.value;
        var email = email_cadastro.value;
        var confirma = confirma_cadastro.value;
        var token = token_cadastro.value;

        if (token != "") {
            alert(`O campo Token deve estar vazio, ou clique no botão Cadastrar com token`)
        } else if (nome == "" || telefone == "" || email == "" || senha == "" || confirma == "") {
            alert(`Todos os campos (exceto o token) devem estar preenchidos`)
        } else if (!email.includes('@') || (!email.endsWith('.com') && !email.endsWith('.com.br'))) {
            alert(`insira um email válido`)
        } else if (criteriosAtendidos < 5) {
            alert(`Senha deve conter todos os requisitos`)
        } else if (senha != confirma){
            alert(`A senha e a confimação devem ser iguais`)
        } else {
            guarda_nome = nome;
            guarda_email = email;
            guarda_senha = senha;
            guarda_confirma = confirma;

            alert(`Cadastro realizado com sucesso!`);

            ir_cadastro2.href = "cadastro2.html";
        } 
    }
    
</script>
