<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login: Usuário</title>
    <link rel="stylesheet" href="styles/cadastro_login.css">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/styles.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="./js/sessao.js"></script>

</head>

<body>
  <div id="div_login" class="pagina_login" style="display: flex;">
    <div class="card_erro" id="cardErro">
      <img id="imagem_erro" src="" alt="">
      <span id="mensagem_erro"></span>
    </div>
    <!-- LATERAL FORM (50%) -->
    <section class="lateral_formulario">
      <div class="lateral_formulario_interna">
        <h1 class="titulo_login">Login</h1>

        <div class="formulario_login" action="#" method="post" novalidate>
          <label class="rotulo_login" for="email_login">E-mail</label>
          <input class="campo_login" value="julia@gmail.com" id="email_login" type="email" placeholder="email@email.com"
            required>

          <label class="rotulo_login" for="senha_login">Senha</label>
          <input class="campo_login" id="senha_login" type="password" placeholder="********" required>

          <div id="div_mensagemSenha"></div>

          <a id="ir_dash" href="#"><button class="botao_padrao" onclick="entrar()">Entrar</button></a>
        </div>

        <hr class="separador_login">

        <!-- <div class="redes_login">
          <button class="botao_social google_login">
            <img src="assets/icons/icon-google.png" alt="Google">
            Continuar com o Google
          </button>

          <button class="botao_social apple_login">
            <img src="assets/icons/icon-apple.png" alt="Apple">
            Continuar com o Apple ID
          </button>
        </div> -->

        <p class="links_login">
          Não possui uma conta? <a class="link_login" href="cadastro.html">Cadastre-se</a>
        </p>
        <p class="links_login">
          <a class="link_login" href="https://sptech-team-termotech.atlassian.net/servicedesk/customer/portals">Esqueci minha senha</a>
        </p>
      </div>
    </section>
    <!-- LATERAL IMAGEM (50%) -->
    <section class="lateral_imagem">
      <div class="lateral_imagem_interna">
        <img src="./assets/img/img_page_login.png" class="imagem_cadastro" alt="">
      </div>
    </section>

  </div>

</body>

</html>

<script>

  function entrar() {
    // aguardar();

    var emailVar = email_login.value;
    var senhaVar = senha_login.value;

    if (emailVar == "" || senhaVar == "") {
      cardErro.style.display = "block"
      imagem_erro.src = "/assets/icons/img_cancel.png"

      mensagem_erro.innerHTML = "Preencha todos os campos para seguir em frente";
      finalizarAguardar();
      return false;
    }
    else {
      console.log("FORM LOGIN: ", emailVar);
      console.log("FORM SENHA: ", senhaVar);

      fetch("/usuarios/autenticar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          emailServer: emailVar,
          senhaServer: senhaVar
        })
      }).then(function (resposta) {
        console.log("ESTOU NO THEN DO entrar()!")
        console.log(resposta);

        if (resposta.ok) {
          console.log(resposta);

          resposta.json().then(json => {
            console.log(json);
            console.log(JSON.stringify(json));
            sessionStorage.EMAIL_USUARIO = json[0].email;
            sessionStorage.NOME_USUARIO = json[0].nome;
            sessionStorage.ID_USUARIO = json[0].idUsuario;
            sessionStorage.ID_EMPRESA = json[0].empresaId;


            if(sessionStorage.EMAIL_USUARIO.includes('suporte')) {

            setTimeout(function () {
              window.location = "suporte.html";
            }, 1000); // se for suporte, vai pro suporte.html

            } else {

              setTimeout(function () {
                window.location = "tela_minas.html";
              }, 1000); // se for usuário vai pra tela_minas

            }


          });
        } else {

          console.log("Houve um erro ao tentar realizar o login!");

          resposta.text().then(texto => {
            console.error(texto);
            // finalizarAguardar(texto);
          });
        }

      }).catch(function (erro) {
        console.log(erro);
      })

      return false;
    }

  }

  // function sumirMensagem() {
  //   cardErro.style.display = "none"
  // }


</script>
