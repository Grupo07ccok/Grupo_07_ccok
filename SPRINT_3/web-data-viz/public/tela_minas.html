<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard: Escolha a mina</title>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/dash.css">
    <link rel="stylesheet" href="styles/tela_minas.css">
    <script src="./js/sessao.js"></script>
</head>

<body>
    <div class="container">
        <header class="navbar">
            <div class="logo">
                <img src="assets/img/logo.png" alt="Logo Termo Tech"> <!--trocar pela logo de vdd-->
                <span>TermoTech</span>
            </div>

            <nav class="menu">
                <a id="cont_link1" href="" class="">Página inicial</a>
                <a id="cont_link2" href="cadastro_minas.html" class="">Cadastrar mina</a>
                <a id="cont_link2" href="https://sptech-team-termotech.atlassian.net/servicedesk/customer/portals" class="">Suporte</a>
                <!-- classe >active< funfa como um "agora" - dps colocar nas outras-->
            </nav>
            <div>
                <p>Olá, seja bem vindo(a) <span id="nome_usuario"></span></b>
                    <button class="signup" onclick="limparSessao()">SAIR</button>
            </div>
        </header>


        <div class="cont_conteudo">
            <h1 class="titulo">Visão geral de todas as suas minas</h1>
            <div class="cont_faixa">
                <div class="titulo_faixa">
                    <b>Faixas de alerta base</b>
                </div>
                <div class="cont_cards_faixa">
                    <div class="card_faixa faixa_critico">
                        <b class="nome_faixa">Crítico</b>
                        <b class="descricao_faixa">Temperatura > 30</b>
                    </div>
                    <div class="card_faixa faixa_perigoso">
                        <b class="nome_faixa">Perigoso</b>
                        <b class="descricao_faixa">Temperatura > 27 e <= 30</b>
                    </div>
                    <div class="card_faixa faixa_moderado">
                        <b class="nome_faixa">Moderado</b>
                        <b class="descricao_faixa">Temperatura > 23 e <= 27</b>
                    </div>
                    <div class="card_faixa faixa_bom">
                        <b class="nome_faixa">Bom</b>
                        <b class="descricao_faixa">Temperatura > 20 e <= 23</b>
                    </div>
                    <div class="card_faixa faixa_excelente">
                        <b class="nome_faixa">Excelente</b>
                        <b class="descricao_faixa">Temperatura <= 20</b>
                    </div>
                </div>
            </div>
            <section id="cont_minas">

            </section>
        </div>
        <div class="cardErro" id="card_erro">
            <img id="imagem_erro" src="" alt="">
            <span id="mensagem_erro"></span>
        </div>
    </div>



</body>

<script>

    nome_usuario.innerHTML = sessionStorage.NOME_USUARIO

    function listar_minas() {
        var idEmpresa = sessionStorage.ID_EMPRESA
        console.log(idEmpresa);

        fetch(`minas/listar_minas/${idEmpresa}`)
            .then(response => response.json())
            .then(function (resposta) {
                cont_minas.innerHTML = ""
                console.log(resposta);
                for (var i = 0; i < resposta.length; i++) {
                    var mina_atual = resposta[i];
                    var temperatura_maxima_atual = Number(mina_atual.temperatura_maxima_atual)
                    var temperatura_alerta = Number(mina_atual.temperaturaAlerta)

                    var cor_letra = ""

                    if (temperatura_maxima_atual > 30) {
                        cor_letra = "#FF0000"
                    } else if (temperatura_maxima_atual < 30 && temperatura_maxima_atual > 27) {
                        cor_letra = "#FF8800"
                    } else if (temperatura_maxima_atual < 27 && temperatura_maxima_atual > 23) {
                        cor_letra = "#D0CA03"
                    } else if (temperatura_maxima_atual < 23 && temperatura_maxima_atual > 20) {
                        cor_letra = "#80DB00"
                    } else {
                        cor_letra = "#0BD700"

                    }
                    cont_minas.innerHTML += `

                    <a href="dashboard.html?id=${mina_atual.idMina}">
                        <div class="card_mina">
                            <div class="cont_id">
                                <p class="texto_card"><b>ID da mina: ${mina_atual.idMina}</b>
                            </div>
                            <p class="texto_card">
                                <b>Temperatura atual:</b>
                                <br>
                                <b class="valor_temperatura" style="color: ${cor_letra};">${temperatura_maxima_atual}º</b>
                                </b>
                        </div>
                    </a>
                    `
                }

            })

    }
    listar_minas()
    setInterval(() => {
        listar_minas()
    }, 10000);






</script>

</html>
