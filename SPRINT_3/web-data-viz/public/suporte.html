            <div class="btn-nav-white">

                <a
                    href="https://bandteccom-my.sharepoint.com/:w:/g/personal/nathan_asilva_sptech_school/IQCwgm8bzspfTJ5SKmsjMmZ1AXXqFx1nGUOaTSPmPAsi1AI?e=T4JgnG">

    </div>

    <!-- ------------------------- BobIA ------------------------- -->
    <div id="container_bob">

        <div class="caixa-titulo">
            <h1>SUPORTE</h1>
        </div>

        <div class="caixa-chat">
            <div id="pergunta_chat"></div>
            <div id="resposta"></div>
        </div>

        <div class="caixa-pergunta">
            <textarea id="pergunta" type="text" placeholder="Digite a pergunta..."></textarea>

            <button onclick="gerarResposta()">></button>
        </div>

        <br><br>

        <!-- <a href="./assets/Documentacao_TermoTech.pdf"> documentacao</a> -->

    </div>

    <div id="bobIA" class="button_bobIA">
        <button class="botao_bob" onclick="chamar_bob()"><img src="./assets/img/help_desk.png" alt=""></button>


    </div>
    <!-- ----------------------- FIM BobIA ----------------------- -->

</body>

<script>

    nome_usuario.innerHTML = sessionStorage.NOME_USUARIO

    var cont_click = 0;

    function chamar_bob() {
        cont_click++

        if (cont_click == 1) {
            container_bob.style.display = 'block'
        } else {
            container_bob.style.display = 'none'
            cont_click = 0
        }
    }

    // ------------------------- BobIA -------------------------

    async function gerarResposta() {
        const pergunta = document.getElementById('pergunta').value;

        const response = await fetch('/perguntar', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ pergunta })
        });

        const data = await response.json();

        resposta.style.display = 'block';
        pergunta_chat.style.display = 'block';

        document.getElementById('pergunta_chat').innerHTML = `${pergunta}`;

        document.getElementById('resposta').innerHTML = `${data.resultado}`;

        document.getElementById('pergunta').value = "";

    }

    // ----------------------- FIM BobIA -----------------------

</script>
