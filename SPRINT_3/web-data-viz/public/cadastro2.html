<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro: Empresa</title>
    <link rel="stylesheet" href="styles/cadastro_login.css">
    <link rel="stylesheet" href="styles/global.css">
</head>

<body>
    <div class="pagina_login">

        <!-- LATERAL IMAGEM (50%) -->
        <section class="lateral_imagem">
            <div class="lateral_imagem_interna">
                <img src="assets/img/img_page_cadastro.png" class="imagem_cadastro" alt="">
            </div>
        </section>

        <!-- LATERAL FORM (50%) -->
        <section class="lateral_formulario">
            <div class="lateral_formulario_interna">
                <h1 class="titulo_login">Dados da empresa</h1>

                <div class="formulario_login">
                    <div class="line_campos">
                        <div class="container_inputs">
                            <label class="rotulo_login" for="input_nome_fantasia">Nome fantasia</label>
                            <input class="campo_login" id="input_nome_fantasia" type="nome"
                                placeholder="Insira o nome fantasia:" required>
                        </div>
                        <div class="container_inputs">
                            <label class="rotulo_login" for="input_razao_social">Razão social</label>
                            <input class="campo_login" id="input_razao_social" type="razao_social"
                                placeholder="Insira a razão social:" required>
                        </div>
                    </div>

                    <label class="rotulo_login" for="input_cnpj">CNPJ</label>
                    <input class="campo_login" id="input_cnpj" type="nome" placeholder="Insira o CNPJ:" required>

                    <div class="line_campos">
                        <div class="container_inputs">
                            <label class="rotulo_login" for="input_cep">CEP</label>
                            <input class="campo_login" id="input_cep" type="nome" placeholder="Insira o CEP:" required>
                        </div>
                        <div class="container_inputs">
                            <label class="rotulo_login" for="input_numero">Número</label>
                            <input class="campo_login" id="input_numero" type="text" placeholder="Insira o número:"
                                required>
                        </div>
                    </div>

                    <label class="rotulo_login" for="input_complemento">Complemento</label>
                    <input class="campo_login" id="input_complemento" type="text" placeholder="Insira o complemento:"
                        required>

                    <label class="rotulo_login" for="input_email">Email Responsável</label>
                    <input class="campo_login" id="input_email" type="text" placeholder="Insira o email do responsável:"
                        required>

                    <!-- <button type="submit" class="botao_formulario"  -->
                    <button class="botao_padrao" onclick="listar_empresa()"><a id="ir_login"
                            href="#">Cadastrar</a></button>
                </div>

                <hr class="separador_login">


                <p class="links_login">
                    Já possui uma conta? <a class="link_login" href="login.html">Faça login</a>
                </p>
                <p class="links_login">
                    <a class="link_login" href="#">Esqueci minha senha</a>
                </p>
            </div>
        </section>

    </div>
    <div class="card_erro" id="cardErro">
        <img id="imagem_erro" src="" alt="">
        <span id="mensagem_erro"></span>
    </div>


    <div class="pop_up" id="id_pop_up">
        <div class="pop_up_conteudo">
            <img id="imagem_pop_up" src="assets/icons/img_aceitar.png" alt="">
            <span id="mensagem_token">O seu token é: <span id="valor_token"></span></span>
            <br><br>
            <span>Guarde-o e salve em algum lugar, pois não será enviado em outro local!</span>
            <div class="cont_btns">
                <a href="login.html"><button class="botao_padrao">Ir para a página de login</button></a>
                <a href="cadastro.html"><button class="botao_padrao">Ir para a página de cadastro</button></a>

            </div>
        </div>
    </div>
</body>

</html>

<script>

    function listar_empresa() {
        // Inputs:
        var nome_fantasia = input_nome_fantasia.value
        var razao_social = input_razao_social.value
        var cnpj = input_cnpj.value
        var cep = input_cep.value
        var numero = input_numero.value
        var complemento = input_complemento.value
        var email = input_email.value

        if (nome_fantasia == "" || razao_social == "" || cnpj == "" || cep == "" || numero == "" || email == "") {
            imagem_erro.src = "assets/icons/img_cancel.png"
            mensagem_erro.innerHTML = "Preencha todos os campos para cadastrar a empresa!"
            card_erro.style.display = "flex"
        } else if (cnpj.length != 14) {
            imagem_erro.src = "assets/icons/img_cancel.png"
            mensagem_erro.innerHTML = "Insira um CNPJ com 14 caracteres!"
            card_erro.style.display = "flex"
        } else if (cep.length != 8) {
            imagem_erro.src = "assets/icons/img_cancel.png"
            mensagem_erro.innerHTML = "Insira um CEP com 8 caracteres!"
            card_erro.style.display = "flex"
        } else if (email.includes('@') == false && (email.endsWith('.com') || email.endsWith('.com.br')) == false) {
            imagem_erro.src = "assets/icons/img_cancel.png"
            mensagem_erro.innerHTML = "Insira um email que contenha @ e .com!"
            card_erro.style.display = "flex"
        } else {

            if (complemento == "") {
                complemento == null
            }
            fetch(`/empresas/listar_empresas`)
                .then(response => response.json())
                .then(function (resposta) {
                    console.log(resposta);

                        var token = ""
                        for (var i = 0; i < resposta.length; i++) {
                            var empresa_atual = resposta[i];
                            token = empresa_atual.idEmpresa
                            console.log(token);
                        }

                        var token_final = `${token}${Math.floor(Math.random() * 1000000)}`

                        console.log('TOKEN FINAL', token_final);
                        valor_token.innerHTML = token_final

                        cadastrar_empresa(nome_fantasia, razao_social, cnpj, cep, numero, complemento, email, token_final)
                })


        }

    }

    function cadastrar_empresa(nome_fantasia, razao_social, cnpj, cep, numero, complemento, email, token) {
        fetch(`/empresas/cadastrar`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                nomeFantasiaServer: nome_fantasia,
                razaoSocialServer: razao_social,
                cnpjServer: cnpj,
                cepServer: cep,
                numeroServer: numero,
                complementoServer: complemento,
                emailResponsavelServer: email,
                tokenServer: token,
            })
        })
            .then(response => response.json())
            .then(function (resposta) {
                console.log("resposta: ", resposta);
                setTimeout(function () {
                    id_pop_up.style.display = "flex"
                }, 1500);
            })
        return false;

    }
</script>
